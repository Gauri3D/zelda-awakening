<html>
<head>
<style>
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#game {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div style="width:100%;height:100%;max-width:100%">
    <div id="game"></div>
</div>

<script>

EJS_player = "#game";

EJS_core = "gambatte";

EJS_gameName =
    "The Legend of Zelda - Link's Awakening DX [GBC] Español";

EJS_color = "#0064ff";

EJS_startOnLoaded = true;

EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

EJS_gameUrl =
    "The Legend of Zelda - Link's Awakening DX [GBC] Español.gbc";

EJS_DEBUG_XX = true;

EJS_ready = function () {
    console.log("[EJS] EmulatorJS listo");
};

EJS_onGameStart = function () {
    console.log("[EJS] Zelda iniciado");
};

window.addEventListener("error", function(event) {
    console.error("[ERROR]", event.error || event.message);
});

window.addEventListener(
    "unhandledrejection",
    function(event) {
        console.error("[PROMISE]", event.reason);
    }
);

</script>

<script src=
"https://cdn.emulatorjs.org/stable/data/loader.js">
</script>

</body>
</html>
