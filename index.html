```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>The Legend of Zelda - Link's Awakening DX</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <script>
        /*
         * Contenedor donde se cargará EmulatorJS
         */
        EJS_player = "#game";

        /*
         * Core recomendado para esta prueba.
         * Evitamos mGBA por ahora.
         */
        EJS_core = "gambatte";

        /*
         * Nombre del juego
         */
        EJS_gameName =
            "The Legend of Zelda - Link's Awakening DX";

        /*
         * ROM
         * Debe coincidir exactamente con el nombre
         * del archivo que tienes en GitHub.
         */
        EJS_gameUrl =
            "The Legend of Zelda - Link's Awakening DX [GBC] Español.gbc";

        /*
         * Archivos de EmulatorJS
         */
        EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        /*
         * Iniciar automáticamente
         */
        EJS_startOnLoaded = true;

        /*
         * Desactivar threads.
         * Puede mejorar estabilidad en navegadores móviles.
         */
        EJS_threads = false;

        /*
         * Fuerza los cores legacy / WebGL1.
         * Útil para evitar algunos crashes de WebGL2.
         */
        EJS_forceLegacyCores = true;

        /*
         * Color de interfaz
         */
        EJS_color = "#0064ff";

        /*
         * Logs para diagnosticar si vuelve a fallar
         */
        EJS_DEBUG_XX = true;

        EJS_ready = function () {
            console.log("[EJS] EmulatorJS cargado correctamente");
        };

        EJS_onGameStart = function () {
            console.log("[EJS] Zelda iniciado");
        };

        EJS_onExit = function () {
            console.warn("[EJS] El emulador fue cerrado");
        };

        /*
         * Detectar errores JavaScript
         */
        window.addEventListener("error", function (event) {
            console.error(
                "[WINDOW ERROR]",
                event.error || event.message
            );
        });

        /*
         * Detectar errores de promesas / WASM
         */
        window.addEventListener(
            "unhandledrejection",
            function (event) {
                console.error(
                    "[PROMISE ERROR]",
                    event.reason
                );
            }
        );

        /*
         * Si aparece esto en consola antes del fallo,
         * significa que la página realmente se está recargando.
         */
        window.addEventListener(
            "beforeunload",
            function () {
                console.warn(
                    "[PAGE] La página se está recargando"
                );
            }
        );
    </script>

    <script
        src="https://cdn.emulatorjs.org/stable/data/loader.js">
    </script>

</body>
</html>
```
